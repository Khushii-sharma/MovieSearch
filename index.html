<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- Login Page -->
    <div class="container" id="loginPage">
        <div class="card">
            <h2>Login</h2>
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" placeholder="Enter Email" required>
            </div>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <button onclick="login()">Login</button>
            <p id="errorMsg" style="color: red;"></p>
        </div>
    </div>

    <!-- Movie Page -->
    <div id="moviePage">
        <h1 style="text-align: center; color: white;">Movie Search</h1>
        <div class="moviecontainer">
            <div class="input-box">
                <input type="text" id="searchInput" placeholder="Enter movie name">
            </div>
            <button class="search-btn" onclick="searchMovies()">Search</button>
        </div>
        <ul id="movie-list"></ul>
    </div>


    <script>
        const apiKey = "5ff790a6";

        async function login() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            try {
                // Load users.json
                const res = await fetch("users.json");
                const users = await res.json();

                // Check is user exists
                const user = users.find(u => u.email === email && u.password === password)

                if(user) {
                    document.getElementById("loginPage").style.display = "none";
                    document.getElementById("moviePage").style.display = "block";
                } else {
                    errorMsg.textContent = "Invalid email or password";
                }
            } catch (err) {
                console.log("Error loading:", err);
            }
            
        }

        async function searchMovies() {
            const searchTerm = document.getElementById("searchInput").value.trim();

            if (searchTerm === "") {
                alert("Please enter a movie name");
                return;
            }
            const apiUrl = `https://www.omdbapi.com/?apikey=${apiKey}&s=${searchTerm}`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();

                const movieList = document.getElementById("movie-list");
                movieList.innerHTML = "";

                if (data.Response === "True") {
                    data.Search.forEach(movie => {
                        const li = document.createElement("li");
                        li.classList.add("movie-card");

                        li.innerHTML = `
                            <img src="${movie.Poster !== "N/A" ? movie.Poster : 'https://via.placeholder.com/200x300?text=No+Image'}" alt="${movie.Title}">
                            <h3 style="color: red;">${movie.Title}</h3>
                            <p><i>Year: ${movie.Year}</i></p>
                        `;

                        movieList.appendChild(li);
                    });
                } else {
                    movieList.innerHTML = `<li>No movies found for "${searchTerm}"`;
                }
            } catch (e) {
                console.log("Error fetching movies:", e);
            }
        }
        
    </script>

  
</body>
</html>
